# MPC-expert, within-session smoke experiment only.
# Split units are causally bounded complete laps from one recording/session.
# Metrics are not deployment-quality or cross-scenario generalization metrics.
dataset: data/processed/mpc/20260827-114404-d6cb0e3d.npz
output_dir: runs/mpc-within-session-20260827-114404
seed: 42
device: cuda
torch_threads: 1
epochs: 20
batch_size: 128
learning_rate: 0.001
split_ratios: [0.70, 0.15, 0.15]
model:
  lidar_embedding: 32
  aux_embedding: 16
  hidden_size: 64
loss_weights:
  steering: 2.0
  longitudinal: 1.0
  action_change: 0.05
action_limits:
  low: [-1.0, -3.0]
  high: [1.0, 3.0]
