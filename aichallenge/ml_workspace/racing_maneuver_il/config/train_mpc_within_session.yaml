# MPC-expert, within-session smoke experiment only.
# Split units are causally bounded complete laps from one recording/session.
# Metrics are not deployment-quality or cross-scenario generalization metrics.
# Add every schema-v3 recording here. Training merges them atomically and preserves recording/lap groups.
datasets:
  - data/processed/mpc/run1-target-speed-v3.npz
  # - data/processed/mpc/run2-target-speed-v3.npz
  - data/processed/mpc/run3-target-speed-v3.npz
output_dir: runs/mpc-target-speed-20260831-061401
seed: 42
device: cuda
torch_threads: 1
# Preserve the current local throughput tuning.
epochs: 250
batch_size: 512
learning_rate: 0.0002
split_ratios: [0.70, 0.15, 0.15]
model:
  lidar_embedding: 128
  aux_embedding: 128
  hidden_size: 512
loss_weights:
  steering: 2.5
  longitudinal: 1.0
  action_change: 0.05
selection_metric:
  steering_tolerance_rad: 0.05
  target_speed_tolerance_mps: 0.5
early_stopping:
  patience: 20
  min_delta: 0.002
action_limits:
  low: [-1.0, 0.0]
  high: [1.0, 15.0]
